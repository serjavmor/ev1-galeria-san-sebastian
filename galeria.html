  <main>
    <h2>Nuestra colección</h2>
    <p>Una selección de obras de distintas épocas y estilos. Todas las imágenes son de dominio público.</p>

    <div class="obras">
      <figure>
        <img src="img/noche-estrellada.jpg" alt="La noche estrellada, de Vincent van Gogh: cielo nocturno con remolinos azules, estrellas brillantes y un pueblo dormido bajo un ciprés oscuro">
        <figcaption>La noche estrellada · Vincent van Gogh · 1889</figcaption>
      </figure>
      <figure>
        <img src="img/gran-ola.jpg" alt="La gran ola de Kanagawa, de Hokusai: una ola gigante de espuma blanca a punto de caer sobre tres botes, con el monte Fuji al fondo">
        <figcaption>La gran ola de Kanagawa · Katsushika Hokusai · 1831</figcaption>
      </figure>
      <figure>
        <img src="img/joven-perla.jpg" alt="La joven de la perla, de Johannes Vermeer: retrato de una muchacha con turbante azul y amarillo que mira sobre su hombro y lleva un aro de perla">
        <figcaption>La joven de la perla · Johannes Vermeer · 1665</figcaption>
      </figure>
      <figure>
        <img src="img/nenufares.jpg" alt="Nenúfares, de Claude Monet: estanque de agua verde y azul cubierto de hojas y flores de nenúfar">
        <figcaption>Nenúfares · Claude Monet · 1906</figcaption>
      </figure>
    </div>
  </main>

  <footer>
    <p>Galería Aurora · Valparaíso, Chile</p>
